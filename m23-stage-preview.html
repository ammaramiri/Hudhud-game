<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>هدهد | أركع وأعتدل</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6e5;color:#322b26;font:1rem/1.6 system-ui,sans-serif}main{max-width:860px;margin:auto;padding:16px}h1{margin:4px 0 12px;font-size:clamp(1.5rem,5vw,2.25rem)}nav,section{display:flex;gap:8px;flex-wrap:wrap;margin-block:12px}button{font:inherit;font-weight:650;min-height:44px;padding:8px 16px;border:1px solid #237d6b;border-radius:12px;background:white;color:#237d6b;cursor:pointer}button[aria-pressed=true],#play{background:#237d6b;color:white}figure{margin:0}img{width:100%;display:block;aspect-ratio:4/3;background:#f2dfc0;border-radius:18px}figcaption{padding:8px;text-align:center;font-weight:650}a{color:#237d6b}
main{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;padding:8px 12px;gap:5px}
h1,nav,section{margin:0}nav,section{gap:5px}
figure{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
img{height:100%;min-height:0;aspect-ratio:auto;object-fit:contain;background:transparent}
button{min-height:38px;padding:4px 9px}
figcaption{padding:3px}
</style>
<main>
<h1>أركع وأعتدل</h1>
<nav aria-label="الشخصية"><button data-actor="boy" aria-pressed="true">الطفل</button><button data-actor="girl" aria-pressed="false">الطفلة</button></nav>
<figure><img id="frame" width="1448" height="1086" src="assets/m23/boy-standing.webp" alt="الوقوف قبل الركوع"><figcaption id="caption">الوقوف قبل الركوع</figcaption></figure>
<section aria-label="الوضعيات"><button id="play">شغّل الحركة</button><button data-pose="standing">الوقوف</button><button data-pose="descent">الانحناء</button><button data-pose="bow">الركوع</button><button data-pose="upright">الاعتدال</button><button data-pose="hall">القاعة</button></section>
<a href="index.html">العودة إلى لعبة هدهد</a>
</main>
<script>
const poses={standing:'الوقوف قبل الركوع',descent:'الانحناء',bow:'الركوع',upright:'الاعتدال بعد الركوع',hall:'قاعة الصلاة'};
const frame=document.querySelector('#frame'),caption=document.querySelector('#caption');
const actors=[...document.querySelectorAll('[data-actor]')];
let actor='boy',pose='standing',timer;
const path=(name,person=actor)=>'assets/m23/'+(name==='hall'?'hall':person+'-'+name)+'.webp';
const preload=Object.keys(poses).flatMap(name=>actors.map(button=>{const image=new Image();image.src=path(name,button.dataset.actor);return image}));
function show(name){pose=name;frame.src=path(name);frame.alt=caption.textContent=poses[name]}
actors.forEach(button=>button.onclick=()=>{clearTimeout(timer);actor=button.dataset.actor;actors.forEach(other=>other.setAttribute('aria-pressed',String(button===other)));show(pose)});
document.querySelectorAll('[data-pose]').forEach(button=>button.onclick=()=>{clearTimeout(timer);show(button.dataset.pose)});
try{
 const profile=JSON.parse(localStorage.getItem('hudhud-home-profile-v1')||'{}');
 if(profile?.character==='girl')actors[1].onclick();
}catch{}
document.querySelector('#play').onclick=()=>{
 clearTimeout(timer);
 const sequence=[['standing',650],['descent',370],['bow',1150],['descent',370],['upright',0]];
 function step(index){const [name,delay]=sequence[index];show(name);if(delay)timer=setTimeout(()=>step(index+1),delay)}
 step(0);
};
</script>
</html>
