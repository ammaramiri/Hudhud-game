<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HUDHUD — تجربة الحي</title>
<link rel="stylesheet" href="css/neighborhood-hubs.css?v=0.34.1"><link rel="stylesheet" href="css/n02.css?v=0.34.1">
<style>*{box-sizing:border-box}body{margin:0;background:#fff6e5;color:#322b26;font:16px system-ui,Tahoma,sans-serif}.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:10px}.top h1{font-size:20px;margin:0}.top p{margin:0;font-size:13px}.top a,.top button{font:inherit;border:1px solid #d7ae73;background:#fffaf0;padding:6px 9px;border-radius:8px;color:#322b26;text-decoration:none}#world-screen{position:relative}#world-view{position:relative;height:calc(100dvh - 96px);min-height:300px;overflow:hidden;background:#f2dfc0}#world-stage{position:absolute;width:1536px;height:1024px;transform-origin:top left;left:0;top:0}#world-art{position:absolute;inset:0;width:1536px;height:1024px;object-fit:contain}#world-overview{border:0;border-radius:12px;background:#fff6e5}#destinations{display:grid;gap:7px}#destinations button{border:1px solid #d7ae73;padding:9px;border-radius:10px;background:#fff6e5} @media(max-width:480px){#world-view{height:calc(100dvh - 130px)}}</style></head><body>
<div class="top"><div><h1>الحي — النسخة المعتمدة</h1><p>المرحلة الجاهزة للعب: N02 — أراعي جاري، داخل ممر الجيران</p></div><div><button id="world-map" type="button" onclick="document.getElementById('world-overview').showModal()">مناطق الحي</button> <a href="n02-stage-preview.html">N02 مباشرةً</a></div></div>
<section id="world-screen"><div id="world-view"><div id="world-stage"><img id="world-art" src="assets/world/neighborhood-v3.webp" alt="خريطة الحي"></div></div></section>
<dialog id="world-overview"><p>مناطق الحي</p><div id="destinations"></div><button onclick="this.closest('dialog').close()">إغلاق</button></dialog>
<script>window.HUDHUDWorld={getState:()=>({active:true,scene:'world'})};function fit(){const v=document.getElementById('world-view'),s=document.getElementById('world-stage');const z=Math.min(v.clientWidth/1536,v.clientHeight/1024);s.style.transform=`translate(${(v.clientWidth-1536*z)/2}px,${(v.clientHeight-1024*z)/2}px) scale(${z})`};window.addEventListener('resize',fit);fit();</script>
<script src="js/n02.js?v=0.34.1"></script><script src="js/neighborhood-hubs.js?v=0.34.1"></script></body></html>
